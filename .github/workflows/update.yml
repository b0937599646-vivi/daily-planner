name: 更新天氣和新聞
on:
  schedule:
    # 這裡是 UTC，台灣時間要減 8 小時。
    # 台灣 04:07 和 04:37 各跑一次，第二次是備援，目標在 5:00 前更新好。
    - cron: "7 20 * * *"
    - cron: "37 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: 存回資料
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "更新天氣和新聞" && git push)
